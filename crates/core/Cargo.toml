[package]
name = "dockmorph-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSRunningApplication", "NSGraphics", "NSBitmapImageRep", "NSImageRep", "block2"] }
objc2-application-services = { version = "0.3.2", features = ["HIServices", "AXUIElement", "AXError"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFString", "CFURL", "CFBase"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDate", "NSGeometry", "NSError", "NSData", "NSDictionary", "NSLocale", "NSArray"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
