[package]
name = "dockmorph-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSRunningApplication", "NSGraphics", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDate", "NSGeometry"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
