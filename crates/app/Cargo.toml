[package]
name = "dockmorph-app"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
dockmorph-core = { path = "../core" }
futures = "0.3"
gpui = "0.2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSCell"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry", "NSError"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
